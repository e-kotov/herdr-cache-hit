name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      sha:
        description: Exact commit to test before release publication
        required: true
        type: string

jobs:
  test:
    runs-on: ${{ matrix.os }}
    env:
      LC_ALL: C.UTF-8
      LANG: C.UTF-8
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha || github.sha }}

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.24'

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y jq bc shellcheck

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install jq bc shellcheck

      - name: Check shell script syntax
        run: |
          bash -n watch.sh
          bash -n bin/herdr-cache-view
          for f in lib/*.sh scripts/*.sh; do
            bash -n "$f"
          done

      - name: Run shellcheck
        run: |
          shellcheck watch.sh lib/*.sh bin/herdr-cache-view scripts/*.sh

      - name: Run Go tests & build
        run: |
          go test -v ./cmd/agy-usage
          go build ./cmd/agy-usage

      - name: Run test suite
        run: |
          bash tests/test_watch.sh

      - name: Guard against eval in documentation
        run: |
          if grep -q 'eval' docs/AGY_INTEGRATION.md; then
            echo "::error::docs/AGY_INTEGRATION.md contains 'eval' — this is a known injection vector" >&2
            exit 1
          fi
