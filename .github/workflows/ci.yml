name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y jq bc shellcheck

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install jq bc shellcheck

      - name: Check shell script syntax
        run: |
          bash -n watch.sh
          bash -n bin/herdr-cache-view
          for f in lib/*.sh scripts/*.sh; do
            bash -n "$f"
          done

      - name: Run shellcheck
        run: |
          shellcheck watch.sh lib/*.sh bin/herdr-cache-view scripts/*.sh

      - name: Run Go tests & build
        run: |
          go test -v ./cmd/agy-usage
          go build ./cmd/agy-usage

      - name: Run test suite
        run: |
          bash tests/test_watch.sh
